# git-cliff configuration for Subagent Tiers.
[changelog]
header = """
# Changelog

All notable changes to this project are documented in this file.
The format is based on [Keep a Changelog](https://keepachangelog.com/en/1.1.0/).
This file is generated by [git-cliff](https://git-cliff.org/); do not edit it by hand.

## [Unreleased]\n
"""
body = """
{% if version -%}
## [{{ version | trim_start_matches(pat="v") }}] - {{ timestamp | date(format="%Y-%m-%d") }}
{% else -%}
## [Unreleased]
{% endif -%}
{% for group, commits in commits | group_by(attribute="group") %}
### {{ group | upper_first }}
{% for commit in commits %}
- {{ commit.message | split(pat="\n") | first | upper_first | trim }}\
{% endfor %}
{% endfor %}\n
"""
trim = true
footer = ""

[git]
# Conventional Commit prefixes are parsed off, following the keepachangelog example.
conventional_commits = true
filter_unconventional = false
filter_commits = false
tag_pattern = "v[0-9].*"
sort_commits = "oldest"
commit_parsers = [
  { message = "^(chore|ci|build|style|test|docs?)(\\(.*\\))?!?:", skip = true },
  { message = "^chore\\(release\\)", skip = true },
  { message = "^security(\\(.*\\))?!?:", group = "Security" },
  { message = "^feat(\\(.*\\))?!?:", group = "Added" },
  { message = "^fix(\\(.*\\))?!?:", group = "Fixed" },
  { message = "^deprecate(\\(.*\\))?!?:", group = "Deprecated" },
  { message = "^remove(\\(.*\\))?!?:", group = "Removed" },
  { message = "^(refactor|perf)(\\(.*\\))?!?:", group = "Changed" },
  { message = ".*", group = "Changed" },
]
